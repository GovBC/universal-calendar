workflows:
  android-debug:
    name: Android • فحص APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: "24"
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prepare the site and sync Android
        script: |
          npm run build
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          ./gradlew --no-daemon assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

  ios-simulator:
    name: iOS • فحص المحاكي
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: "24"
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prepare the site and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Build unsigned simulator app
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - ios-derived-data/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  android-release:
    name: Android • حزمة AAB موقّعة
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: "24"
      java: 17
      android_signing:
        - universal_calendar_upload
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prepare the site and sync Android
        script: |
          npm run build
          npx cap sync android
      - name: Build signed release bundle
        script: |
          test -n "$CM_KEYSTORE_PATH" && test -n "$CM_KEYSTORE_PASSWORD" && \
            test -n "$CM_KEY_ALIAS" && test -n "$CM_KEY_PASSWORD"
          cd android
          ./gradlew --no-daemon bundleRelease -PcalendarVersionCode="$BUILD_NUMBER"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS • ملف IPA موقّع
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: "24"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: org.universalcalendar.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prepare the site and sync iOS
        script: |
          npm run build
          npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
